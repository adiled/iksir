name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV" ]; then
            BODY=$(git log --pretty=format:"- %s" "${PREV}..${TAG}" | grep -v "^- chore: bump to ")
          else
            BODY=$(git log --pretty=format:"- %s" "${TAG}" | grep -v "^- chore: bump to ")
          fi
          [ -n "$(echo "$BODY" | tr -d '[:space:]')" ] || BODY="Release $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
